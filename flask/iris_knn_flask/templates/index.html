<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris KNN 분류기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <header class="header">
    <span class="tag">KNN · scikit-learn</span>
    <h1>붓꽃 품종 예측</h1>
  </header>

  <main class="grid">
    <form class="card" method="post">
      <h2>측정값 입력</h2>
      <div class="field">
        <label for="sepal_length">꽃받침 길이 <span>Sepal Length</span></label>
        <div class="input"><input type="number" step="0.01" min="0" id="sepal_length" name="sepal_length" placeholder="5.1" required><em>cm</em></div>
      </div>
      <div class="field">
        <label for="sepal_width">꽃받침 너비 <span>Sepal Width</span></label>
        <div class="input"><input type="number" step="0.01" min="0" id="sepal_width" name="sepal_width" placeholder="3.5" required><em>cm</em></div>
      </div>
      <div class="field">
        <label for="petal_length">꽃잎 길이 <span>Petal Length</span></label>
        <div class="input"><input type="number" step="0.01" min="0" id="petal_length" name="petal_length" placeholder="1.4" required><em>cm</em></div>
      </div>
      <div class="field">
        <label for="petal_width">꽃잎 너비 <span>Petal Width</span></label>
        <div class="input"><input type="number" step="0.01" min="0" id="petal_width" name="petal_width" placeholder="0.2" required><em>cm</em></div>
      </div>
      <button type="submit">예측</button>
    </form>

    <section class="card result">
      <div class="label">예측 결과</div>
      {% if image %}
        <div class="name">{{ prediction }}</div>
        <div class="latin">Iris {{ prediction }}</div>
        <img src="{{ url_for('static', filename=image) }}" alt="{{ prediction }}">
      {% elif prediction %}
        <div class="error">{{ prediction }}</div>
      {% else %}
        <div class="empty">측정값을 입력하면 예측 품종이 표시됩니다.</div>
      {% endif %}
    </section>
  </main>
</div>
</body>
</html>
